<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<!-- Путь экспорта. Показано графикой; текста ровно столько, чтобы назвать части.
     Адрес сервера и его настройки не публикуются. -->
<style>
  .lbl{font-size:14px;fill:#14110E}
  .sub{font-size:12.5px;fill:#6B635A}
  .cap{font-size:11px;fill:#6B635A;letter-spacing:.1em;font-weight:600}
</style>
<rect fill="#F7F4EE" width="1000" height="300"/>

<!-- 1. page: some turns present, some gone -->
<text class="cap" x="30" y="40">ON THE PAGE</text>
<g>
  <rect x="30" y="56" width="150" height="18" fill="none" stroke="#6B635A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="30" y="82" width="150" height="18" fill="none" stroke="#6B635A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="30" y="108" width="150" height="26" fill="#14110E"/>
  <rect x="30" y="142" width="150" height="26" fill="#14110E"/>
  <rect x="30" y="176" width="150" height="26" fill="#14110E"/>
  <rect x="30" y="210" width="150" height="18" fill="none" stroke="#6B635A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="30" y="236" width="150" height="18" fill="none" stroke="#6B635A" stroke-width="1.5" stroke-dasharray="5 4"/>
</g>
<text class="sub" x="30" y="276">filled = in the page · dashed = removed</text>

<!-- arrow -->
<path d="M205 155 H265" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="lbl" x="207" y="144">scroll</text>

<!-- 2. rebuilt -->
<text class="cap" x="290" y="40">REBUILT COPY</text>
<g>
  <rect x="290" y="56" width="150" height="26" fill="#14110E"/>
  <rect x="290" y="90" width="150" height="26" fill="#14110E"/>
  <rect x="290" y="124" width="150" height="26" fill="#14110E"/>
  <rect x="290" y="158" width="150" height="26" fill="#14110E"/>
  <rect x="290" y="192" width="150" height="26" fill="#14110E"/>
  <rect x="290" y="226" width="150" height="26" fill="#14110E"/>
</g>
<text class="sub" x="290" y="276">every turn, in order</text>

<path d="M465 155 H525" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="lbl" x="467" y="144">send</text>

<!-- 3. server -->
<text class="cap" x="550" y="40">SERVER</text>
<rect x="550" y="56" width="170" height="196" fill="none" stroke="#14110E" stroke-width="2.5"/>
<rect x="574" y="92" width="122" height="14" fill="#DBD4C7"/>
<rect x="574" y="116" width="122" height="14" fill="#DBD4C7"/>
<rect x="574" y="140" width="122" height="14" fill="#DBD4C7"/>
<circle cx="586" cy="182" r="7" fill="#D93A00"/>
<text class="lbl" x="604" y="187">renders</text>

<path d="M745 155 H805" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="lbl" x="747" y="144">back</text>

<!-- 4. pdf -->
<text class="cap" x="830" y="40">PDF</text>
<path d="M830 56 h104 l26 26 v170 h-130 z" fill="#EFEAE0" stroke="#14110E" stroke-width="2.5"/>
<path d="M934 56 v26 h26" fill="none" stroke="#14110E" stroke-width="2.5"/>
<rect x="852" y="120" width="86" height="10" fill="#14110E"/>
<rect x="852" y="140" width="86" height="10" fill="#14110E"/>
<rect x="852" y="160" width="56" height="10" fill="#14110E"/>
<text class="sub" x="830" y="276">saved to disk</text>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#14110E"/>
  </marker>
</defs>
</svg>
