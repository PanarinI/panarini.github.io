<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<!-- Черновик: доверенная зона и путь задания. Названия компонентов показываем —
     секрета в них нет; домен, адрес машины и номера портов не публикуем. -->
<style>
  .lbl{font-size:14px;fill:#14110E}
  .name{font-size:15px;font-weight:700;fill:#14110E}
  .sub{font-size:12.5px;fill:#6B635A}
  .cap{font-size:11px;fill:#6B635A;letter-spacing:.1em;font-weight:600}
  .box{fill:none;stroke:#14110E;stroke-width:2.5}
  .soft{fill:#EFEAE0;stroke:#14110E;stroke-width:2.5}
</style>
<rect fill="#F7F4EE" width="1120" height="470"/>

<text class="cap" x="40" y="38">YOUR BROWSER</text>
<rect class="soft" x="40" y="54" width="180" height="120"/>
<text class="name" x="60" y="90">extension</text>
<text class="sub" x="60" y="114">builds the copy</text>
<text class="sub" x="60" y="134">of the conversation</text>

<!-- encrypted channel -->
<path d="M228 114 H352" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<g transform="translate(270,74)">
  <rect x="0" y="10" width="22" height="16" fill="none" stroke="#D93A00" stroke-width="2"/>
  <path d="M5 10 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#D93A00" stroke-width="2"/>
</g>
<text class="lbl" x="242" y="146">encrypted</text>

<!-- trust boundary -->
<rect x="368" y="24" width="712" height="330" fill="none" stroke="#D93A00" stroke-width="2" stroke-dasharray="8 6"/>
<text class="cap" x="384" y="16" fill="#D93A00">THE MACHINE I RENT AND RUN</text>

<text class="cap" x="392" y="60">FIREWALL</text>
<rect class="box" x="392" y="76" width="150" height="98"/>
<text class="lbl" x="410" y="112">only the</text>
<text class="lbl" x="410" y="134">encrypted port</text>
<text class="lbl" x="410" y="156">is open</text>

<path d="M550 124 H600" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

<text class="cap" x="616" y="60">CADDY</text>
<rect class="box" x="616" y="76" width="190" height="98"/>
<text class="name" x="634" y="108">decrypts here</text>
<text class="sub" x="634" y="132">holds the certificate,</text>
<text class="sub" x="634" y="152">renews it by itself</text>

<path d="M814 124 H864" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="sub" x="800" y="196">inside the machine</text>

<text class="cap" x="880" y="60">GOTENBERG · DOCKER</text>
<rect class="box" x="880" y="76" width="180" height="98"/>
<text class="name" x="898" y="108">renders</text>
<text class="sub" x="898" y="132">headless Chromium,</text>
<text class="sub" x="898" y="152">restarted every 10 jobs</text>

<!-- why -->
<text class="sub" x="392" y="212">The renderer speaks plain HTTP and has no login of its own.</text>
<text class="sub" x="392" y="232">That is the whole reason for this shape: it never faces the internet directly,</text>
<text class="sub" x="392" y="252">and the port it listens on is closed from outside.</text>

<!-- back -->
<path d="M970 190 V300 H392 V262" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text class="lbl" x="700" y="292">the PDF comes back the same way</text>

<path d="M368 322 H228" stroke="#14110E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect class="soft" x="40" y="272" width="180" height="100"/>
<text class="name" x="60" y="308">file on your disk</text>
<text class="sub" x="60" y="332">nothing is kept</text>
<text class="sub" x="60" y="352">on the machine</text>

<text class="sub" x="40" y="418">Names of the parts are shown on purpose — there is no secret in them.</text>
<text class="sub" x="40" y="438">The address of the machine, its host name and its port numbers are not published.</text>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#14110E"/>
  </marker>
</defs>
</svg>
