<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" width="1260" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<!-- Собрано tools/gen_schemas.py — правьте скрипт, не файл. Обе локали печатаются вместе. -->
<style>
  .cap{font-size:11px;fill:#6B635A;letter-spacing:.1em;font-weight:600}
  .name{font-size:15px;font-weight:700;fill:#14110E}
  .sub{font-size:12.5px;fill:#6B635A}
  .box{fill:none;stroke:#14110E;stroke-width:2.5}
  .out{fill:none;stroke:#B8AFA0;stroke-width:1.6;stroke-dasharray:5 4}
  .thin{fill:none;stroke:#14110E;stroke-width:1}
  .thick{fill:none;stroke:#14110E;stroke-width:5}
  .arrow{stroke:#14110E;stroke-width:2;fill:none}
</style>
<rect fill="#F7F4EE" width="1260" height="520"/>
<line x1="300" y1="30" x2="300" y2="490" stroke="#B8AFA0" stroke-width="1"/>
<line x1="590" y1="30" x2="590" y2="490" stroke="#B8AFA0" stroke-width="1"/>
<line x1="960" y1="30" x2="960" y2="490" stroke="#B8AFA0" stroke-width="1"/>
<text class="cap" x="40" y="42">ОТБОР СЛОВА</text>
<rect class="box" x="40" y="64" width="200" height="46" rx="3"/>
<text class="name" x="56" y="93">грузовик</text>
<text class="sub" x="40" y="130">кабина отдельно от кузова</text>
<rect class="out" x="40" y="164" width="200" height="46" rx="3"/>
<text class="name" x="56" y="193" fill="#6B635A">борщ</text>
<text class="sub" x="40" y="230">ребёнок скажет «суп»</text>
<text class="sub" x="40" y="286">нет однозначного силуэта →</text>
<text class="sub" x="40" y="302">слово меняют, либо различает</text>
<text class="sub" x="40" y="318">цвет</text>
<text class="cap" x="330" y="42">ПРОМПТ</text>
<path class="thin" d="M330 84 h40 v-26 h40 v26 h40"/>
<path class="thick" d="M470 84 h40 v-26 h40 v26 h40"/>
<text class="sub" x="330" y="116">толстая линия — и признаки,</text>
<text class="sub" x="330" y="132">нарисованные той же линией</text>
<path class="thick" d="M340 236 l46 -44 46 44"/>
<path class="thick" d="M340 236 v14 M432 236 v14"/>
<line x1="480" y1="250" x2="580" y2="250" stroke="#B8AFA0" stroke-width="4" stroke-dasharray="6 5"/>
<line x1="508" y1="266" x2="552" y2="234" stroke="#B4331F" stroke-width="2.5"/>
<text class="sub" x="330" y="286">под предметом нет опоры:</text>
<text class="sub" x="330" y="302">низ остаётся недорисованным</text>
<circle cx="370" cy="370" r="28" fill="none" stroke="#14110E" stroke-width="4"/>
<path d="M352 370 h36 M370 352 v36" stroke="#14110E" stroke-width="4"/>
<circle cx="480" cy="370" r="28" fill="#B4331F" opacity=".5"/>
<line x1="458" y1="392" x2="502" y2="348" stroke="#B4331F" stroke-width="2.5"/>
<text class="sub" x="330" y="424">то, что различает, — чёрная</text>
<text class="sub" x="330" y="440">линия, а не цвет</text>
<text class="cap" x="620" y="42">ОДНА ГЕНЕРАЦИЯ, ДВА ФАЙЛА</text>
<rect class="box" x="620" y="64" width="120" height="120"/>
<circle cx="680" cy="124" r="34" fill="#B4331F" opacity=".75" stroke="#14110E" stroke-width="4"/>
<text class="sub" x="620" y="204">цветной</text>
<path class="arrow" d="M760 124 h60"/>
<path class="arrow" d="M812 118 l8 6 -8 6"/>
<rect class="box" x="834" y="64" width="120" height="120"/>
<circle cx="894" cy="124" r="34" fill="none" stroke="#14110E" stroke-width="4"/>
<text class="sub" x="834" y="204">чёрно-белый</text>
<text class="sub" x="620" y="240">заливки убраны, а не обесцвечены</text>
<text class="sub" x="620" y="300">19 цветозависимых слов получают</text>
<text class="sub" x="620" y="316">второй рисунок, ч/б, нарисованный</text>
<text class="sub" x="620" y="332">отдельно</text>
<text class="cap" x="990" y="42">ПРОВЕРКА И БАНК</text>
<rect class="thin" x="990" y="64" width="38" height="38"/>
<rect class="thin" x="1036" y="64" width="38" height="38"/>
<rect class="thin" x="1082" y="64" width="38" height="38"/>
<rect class="thin" x="990" y="110" width="38" height="38"/>
<rect class="thin" x="1036" y="110" width="38" height="38"/>
<rect class="thin" x="1082" y="110" width="38" height="38"/>
<rect class="thin" x="990" y="156" width="38" height="38"/>
<rect class="thin" x="1036" y="156" width="38" height="38"/>
<rect class="thin" x="1082" y="156" width="38" height="38"/>
<text class="sub" x="990" y="232">смотрим на бумаге в 25 мм</text>
<text class="sub" x="990" y="272">весь пул, все звуки</text>
<text class="sub" x="990" y="288">и позиции: ноль слов</text>
<text class="sub" x="990" y="304">без картинки</text>
<text class="name" x="990" y="376" font-size="30" letter-spacing="-.02em">979 × 2</text>
<text class="sub" x="990" y="400">в банке</text>
</svg>