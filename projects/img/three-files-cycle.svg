  .rd{animation:draw 4s linear infinite}
  @keyframes draw{0%{opacity:0;stroke-dashoffset:130}6%{opacity:1;stroke-dashoffset:130}
    18%{opacity:1;stroke-dashoffset:0}32%{opacity:1;stroke-dashoffset:0}40%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
  .wr{animation:draw2 4s linear infinite}
  @keyframes draw2{0%{opacity:0;stroke-dashoffset:130}58%{opacity:0;stroke-dashoffset:130}
    62%{opacity:1;stroke-dashoffset:130}72%{opacity:1;stroke-dashoffset:0}78%{opacity:1;stroke-dashoffset:0}
    84%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
  .rdt{animation:lab 4s linear infinite}
  @keyframes lab{0%{opacity:0}8%{opacity:1}34%{opacity:1}42%{opacity:0}100%{opacity:0}}
  .wrt{animation:lab2 4s linear infinite}
  @keyframes lab2{0%{opacity:0}58%{opacity:0}62%{opacity:1}78%{opacity:1}84%{opacity:0}100%{opacity:0}}
  .d{animation:dot 4s linear infinite}
  @keyframes dot{0%{opacity:0}24%{opacity:0}30%{opacity:1}74%{opacity:1}82%{opacity:0}100%{opacity:0}}
  .fl{animation:flash 4s linear infinite}
  @keyframes flash{0%{opacity:0}62%{opacity:0}68%{opacity:1}80%{opacity:0}100%{opacity:0}}

  .s0{animation:st0 12s linear infinite}
  @keyframes st0{0%{opacity:1}22%{opacity:1}24%{opacity:0}100%{opacity:0}}
  .s1{animation:st1 12s linear infinite}
  @keyframes st1{0%{opacity:0}22%{opacity:0}24%{opacity:1}55%{opacity:1}57%{opacity:0}100%{opacity:0}}
  .s2{animation:st2 12s linear infinite}
  @keyframes st2{0%{opacity:0}55%{opacity:0}57%{opacity:1}88%{opacity:1}90%{opacity:0}100%{opacity:0}}
  .s3{animation:st3 12s linear infinite}
  @keyframes st3{0%{opacity:0}88%{opacity:0}90%{opacity:1}100%{opacity:1}}

  .e1{animation:ent1 12s linear infinite}
  @keyframes ent1{0%{opacity:0}22%{opacity:0}25%{opacity:1}100%{opacity:1}}
  .e2{animation:ent2 12s linear infinite}
  @keyframes ent2{0%{opacity:0}55%{opacity:0}58%{opacity:1}100%{opacity:1}}
  .e3{animation:ent3 12s linear infinite}
  @keyframes ent3{0%{opacity:0}88%{opacity:0}91%{opacity:1}100%{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .card,.gR,.rd,.wr,.rdt,.wrt,.d,.fl,.s0,.s1,.s2,.s3,.e1,.e2,.e3{animation:none}
    .ar{stroke-dashoffset:0}
    .fl,.s0,.s1,.s2{opacity:0}
    .s3,.e1,.e2,.e3{opacity:1}
  }
</style>
<defs>
