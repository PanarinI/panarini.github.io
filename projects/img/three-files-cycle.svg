<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="100%" role="img" aria-labelledby="tt td" style="max-width:100%;height:auto">
<title id="tt">How a project keeps its context between sessions</title>
<desc id="td">A session opens, reads three files, works, writes back, and ends. Everything said inside the session stays inside it — the dashed area does not cross the gap. What crosses is the writing. The three files behave differently over repeated sessions: the first, holding what the project is and the rules it lives by, stays as it is; the second, holding where the work stands, is replaced whole each time; the third, holding why things are the way they are, gains one entry per session and loses none. Three sessions are shown in a loop.</desc>
<style>
