  .ink{fill:#14110E}
  .mut{fill:#6B635A}
  .acc{fill:#D93A00}
  .h{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#14110E}
  .n{font:600 13.5px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#14110E}
  .c{font:400 12.5px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#6B635A}
  .cap{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;fill:#6B635A}
  .ttl{font:800 19px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#14110E;letter-spacing:-.01em}
  .frame{fill:none;stroke:#14110E;stroke-width:2}
