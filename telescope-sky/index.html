<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The demand sky</title>
<meta name="description" content="An interactive map of search demand: one star is one query, its size the search volume, its position how the words relate.">
<style>
  :root{--paper:#F7F4EE;--ink:#14110E;--mute:#6B635A;--star:#14110E;--accent:#D93A00}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  #view{position:absolute;left:0;right:0;top:0;bottom:52px;cursor:grab;touch-action:none;overflow:hidden}
  #view.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  #links line{stroke:var(--ink);stroke-opacity:.14;stroke-width:calc(1px * var(--k,1))}
  /* соседи: одна округа, разные двери — пунктир, чтобы не спутать с производностью */
  #near line{stroke:var(--ink);stroke-opacity:.42;stroke-width:calc(1.6px * var(--k,1));
    stroke-dasharray:calc(7px * var(--k,1)) calc(5px * var(--k,1))}
  circle{fill:var(--star);fill-opacity:.62}
  circle:hover{fill:var(--accent);fill-opacity:1}
  #card{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
    background:var(--paper);border:2px solid var(--ink);padding:9px 11px 8px;max-width:300px;
    box-shadow:5px 5px 0 var(--ink);z-index:5}
  #card.on{opacity:1}
  #card b{display:block;font-size:14.5px;font-weight:600;margin:0 0 5px;line-height:1.25}
  #card table{border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
  #card td{padding:2px 0}
  #card td:first-child{color:var(--mute);padding-right:14px;text-transform:uppercase;
    font-size:10.5px;letter-spacing:.1em}
  #card .when{margin:7px 0 0;padding-top:6px;border-top:1px solid var(--hair,#DBD4C7);
    font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);letter-spacing:.06em}
  /* labels keep a constant on-screen size: --k is canvas units per pixel */
  text{fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-size:calc(11px * var(--k,1));stroke-width:calc(3px * var(--k,1))}
  text.cap{fill:var(--ink);font-weight:600;letter-spacing:.08em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:calc(13px * var(--k,1))}
  /* query labels appear only once zoomed in: at full extent they overlap into noise */
  text.q,text.clu{opacity:0;transition:opacity .18s}
  svg.near text.q,svg.near text.clu{opacity:1}
  text.clu{font-size:calc(11.5px * var(--k,1))}
  .bar{position:absolute;left:0;right:0;bottom:0;min-height:52px;display:flex;gap:10px;align-items:center;
    padding:9px 14px;background:var(--paper);border-top:2px solid var(--ink)}
  .bar span{font-size:12.5px;color:var(--mute)}
  .bar button{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);padding:8px 10px;cursor:pointer}
  .bar button:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:640px){.bar span{display:none}}
</style><script data-goatcounter="https://panarini.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
